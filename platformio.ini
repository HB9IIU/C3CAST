; ESP32-DATV (SP8ESA) on Seeed Studio XIAO ESP32-C3
;
; Upstream was built with "ESP-IDF 6.2.0", but no such release exists (latest tag: v6.1).
; platformio/espressif32 8.0.0 pins framework-espidf ~4.60100.0 = ESP-IDF 6.1.0,
; the closest available version. The older pioarduino platform only offers IDF 5.5.x.
[env:seeed_xiao_esp32c3]
platform = platformio/espressif32@8.0.0
board = seeed_xiao_esp32c3
framework = espidf
monitor_speed = 115200
upload_protocol = esptool
; Re-applies upstream's rf_bank_guard.ld to the app link (PIO's SCons link ignores the CMake option).
extra_scripts = post:pio_rf_guard.py
