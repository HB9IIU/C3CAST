<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ app_name }} setup</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="stylesheet" href="/static/c3cast.css?v={{ app_version }}">
</head>
<body class="window-pending">
{% include "_icons.html" %}
<div id="toast" class="toast d-none" role="status"></div>
<div class="wrap" style="max-width:55rem">

  <header class="bar">
    <img class="logo" src="/static/logo.svg" alt="">
    <h1 class="brand">{{ app_name }} setup<small>v{{ app_version }} · by HB9IIU</small>{% if 'beta' in app_version %}<span class="beta">BETA</span>{% endif %}</h1>
    <span class="grow"></span>
    <a href="/" class="btn"><svg class="i"><use href="#i-back"/></svg>Transmitter</a>
  </header>

  <section class="panel">
    <div class="ph"><svg class="i"><use href="#i-sliders"/></svg>Station settings</div>
    <div class="pb">
      <div class="two field">
        <div>
          <div class="lab"><label for="callsign">Callsign</label></div>
          <input id="callsign" class="inp" maxlength="12" autocomplete="off" spellcheck="false">
        </div>
        <div>
          <div class="lab"><label for="locator">Locator</label></div>
          <input id="locator" class="inp" maxlength="8" autocomplete="off" spellcheck="false" placeholder="JN36kl">
        </div>
      </div>
      <div class="field">
        <div class="lab"><label>Camera picture</label></div>
        <div style="display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 2rem;margin-bottom:.5rem">
          <label style="display:flex;gap:.6rem;align-items:center;cursor:pointer"><input id="banner" type="checkbox"> Show the top banner (callsign and clock)</label>
          <span id="timeRow">
            <label style="cursor:pointer"><input type="radio" name="clockzone" value="utc"> UTC</label>
            <label style="cursor:pointer;margin-left:1.2rem"><input type="radio" name="clockzone" value="local"> Local time</label>
          </span>
        </div>
        <label style="display:flex;gap:.6rem;align-items:center;cursor:pointer"><input id="marquee" type="checkbox"> Show the scrolling text at the bottom</label>
      </div>
      <div class="field">
        <button id="save" class="btn save-primary" type="button"><svg class="i"><use href="#i-save"/></svg>Save settings</button>
        <div id="msg" class="note" role="status" style="margin-top:.5rem"></div>
      </div>
    </div>
  </section>

  <section class="panel" style="margin-top:.6rem">
    <div class="ph"><svg class="i"><use href="#i-plug"/></svg>Saved board</div>
    <div class="pb">
      <div id="board" class="note field" style="font-size:.92rem;color:var(--text)"></div>
      <div class="row">
        <button id="forget" class="btn danger"><svg class="i"><use href="#i-refresh"/></svg>Forget board</button>
        <span class="note">the next check scans the Espressif USB ports again</span>
      </div>
    </div>
  </section>

  <footer><span>{{ app_name }} v{{ app_version }} &middot; by HB9IIU</span><span>firmware: SP8ESA ESP32-DATV</span></footer>
</div>

<script id="window-config" type="application/json">{{ {'guarded': single_window, 'before': [], 'after': [], 'version': app_version}|tojson }}</script>
<script id="console-code" type="text/plain">
const $ = id => document.getElementById(id);
async function post(url, body) {
  const r = await fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body || {})});
  return {ok: r.ok, data: await r.json().catch(() => ({}))};
}
const say = (ok, text) => { $('msg').className = 'note ' + (ok ? 'ok-text' : 'bad-text'); $('msg').textContent = text; };
function show(s) {
  $('callsign').value = s.callsign; $('locator').value = s.locator; $('marquee').checked = s.marquee; $('banner').checked = s.banner;
  document.querySelector(`input[name=clockzone][value=${s.local_time ? 'local' : 'utc'}]`).checked = true; dimTime();
  $('board').textContent = s.board.port ? `${s.board.port} · USB serial ${s.board.serial || 'unknown'}` : 'none saved';
}
function dimTime() {                       // no banner, no clock: the choice is greyed out
  document.querySelectorAll('input[name=clockzone]').forEach(e => e.disabled = !$('banner').checked);
  $('timeRow').style.opacity = $('banner').checked ? '' : '.45';
}
$('banner').onchange = dimTime;
async function load() { show(await (await fetch('/api/setup')).json()); }
$('save').onclick = async () => {
  const r = await post('/api/setup', {callsign: $('callsign').value, locator: $('locator').value, marquee: $('marquee').checked, banner: $('banner').checked,
                                           local_time: document.querySelector('input[name=clockzone]:checked').value === 'local'});
  if (!r.ok) return say(false, r.data.error || 'could not save');
  $('toast').className = 'toast ok';
  $('toast').textContent = 'Settings saved';
  setTimeout(() => { location.href = '/'; }, 1200);           // back to the transmitter by itself
};
$('forget').onclick = async () => {
  const r = await post('/api/connection/forget');
  say(r.ok, r.ok ? 'board forgotten' : (r.data.error || 'could not forget'));
  load();
};
load();

</script>
<script src="/static/window-session.js?v={{ app_version }}"></script>
</body>
</html>
